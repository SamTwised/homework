<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/index.css" />
    <link rel="stylesheet" href="./css/base/var.css" />
    <link rel="shortcut icon" href="./icons/favicon.ico" type="image/x-icon" />
    <title>Dyson</title>
  </head>
  <body>
    <header class="header">
      <div class="container header__container">
        <a class="header__logo" href="#">
          <img src="./icons/logo-icon.svg" alt="Логотип Dyson" />
        </a>
        <nav class="menu header__menu" id="header__menu" aria-label="Главное меню">
          <ul class="menu__list">
            <li class="menu__item">
              <a class="menu__link" href="#" lang="ru">О нас</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#">Доставка и оплата</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#">Регистрация продукта</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#">Сервис</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#">Сертификаты и лицензии</a>
            </li>
          </ul>
        </nav>
        <div class="header__card">
          <button
            class="header__actions-button"
            title="Корзина"
            aria-label="Корзина"
          >
            <svg width="50" height="50">
              <use
                class="header__actions-icon"
                href="./icons/cart-icon.svg"
              ></use>
            </svg>
          </button>
          <button
            class="header__burger burger"
            aria-label="Открыть меню"
            aria-expanded="false"
            aria-controls="header__menu"
          >
            <svg width="50" height="50">
              <use
                class="burger__icon-menu"
                href="./icons/sprite.svg#menu-burger"
              ></use>
              <use
                class="burger__icon-cross"
                href="./icons/sprite.svg#menu-cross"
              ></use>
            </svg>
          </button>
        </div>
      </div>
    </header>
  </body>
  <script defer src="./js/index.js" type="module"></script>
</html>
